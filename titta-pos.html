<!DOCTYPE html>

*{box-sizing:border-box}

.bd{background:#ffb300;color:#000;border-radius:10px;padding:0 6px;font-size:12px}
.wrap{padding:12px;max-width:1400px;margin:auto}
.banner{background:#fff3cd;padding:8px 14px;font-size:14px}
.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}

table{width:100%;border-collapse:collapse;background:#fff}
th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:right;font-size:14px}

.mut{color:var(--mut)}

const hash=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};

/* ================= Excel (xlsx) بدون مكتبات ================= */
function crc32(b){let t=crc32.t;if(!t){t=crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}}let x=-1;for(let i=0;i<b.length;i++)x=t[(x^b[i])&255]^(x>>>8);return(x^-1)>>>0}
function zip(files){const enc=new TextEncoder();const parts=[],cd=[];let off=0;
 for(const f of files){const nm=enc.encode(f.name),d=enc.encode(f.data),crc=crc32(d);
  const l=new DataView(new ArrayBuffer(30));l.setUint32(0,0x04034b50,true);l.setUint16(4,20,true);l.setUint16(6,0x0800,true);l.setUint16(12,0x21,true);l.setUint32(14,crc,true);l.setUint32(18,d.length,true);l.setUint32(22,d.length,true);l.setUint16(26,nm.length,true);
  parts.push(new Uint8Array(l.buffer),nm,d);
  const c=new DataView(new ArrayBuffer(46));c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(14,0x21,true);c.setUint32(16,crc,true);c.setUint32(20,d.length,true);c.setUint32(24,d.length,true);c.setUint16(28,nm.length,true);c.setUint32(42,off,true);
  cd.push(new Uint8Array(c.buffer),nm);off+=30+nm.length+d.length}
 const sz=cd.reduce((a,x)=>a+x.length,0);const e=new DataView(new ArrayBuffer(22));e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,sz,true);e.setUint32(16,off,true);
 return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
function xlsx(sheets){
 const X=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'');
 const col=i=>{let s='';i++;while(i){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s};
 const H='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>';
 const files=[
  {name:'[Content_Types].xml',data:H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'},
  {name:'_rels/.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
  {name:'xl/workbook.xml',data:H+'<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>`<sheet name="${X(s.name).slice(0,31)}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'},
  {name:'xl/_rels/workbook.xml.rels',data:H+'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+'</Relationships>'}];
 sheets.forEach((s,i)=>files.push({name:`xl/worksheets/sheet${i+1}.xml`,data:H+'<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView rightToLeft="1" workbookViewId="0"/></sheetViews><sheetData>'+s.rows.map((r,ri)=>`<row r="${ri+1}">`+r.map((v,ci)=>{const ref=col(ci)+(ri+1);if(v===null||v===undefined||v==='')return'';return typeof v==='number'&&isFinite(v)?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t>${X(v)}</t></is></c>`}).join('')+'</row>').join('')+'</sheetData></worksheet>'}));
 return zip(files)}

/* ================= التخزين (IndexedDB على الكمبيوتر) ================= */

const KEYS=['products','customers','sales','expenses','users','settings','stocklog'];
const openDB=()=>new Promise((ok,no)=>{const r=indexedDB.open('titta_pos',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});

/* ================= الربط بالموقع (Supabase) ================= */
const CL={tok:'',exp:0,ok:false,pend:[],err:'',timer:null,sTimer:null,sync:null,last:0,seen:null,dirty:new Set(),pushing:false,pulling:false,again:false,syncErr:'',offered:false};
const cfg=()=>DB.settings.cloud;
async function authCall(grant,body){
 const c=cfg();
 const r=await fetch(c.url.replace(/\/$/,'')+'/auth/v1/token?grant_type='+grant,{method:'POST',headers:{apikey:c.key,'Content-Type':'application/json'},body:JSON.stringify(body)});
 const j=await r.json().catch(()=>({}));
 if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'فشل تسجيل الدخول');
 CL.tok=j.access_token;CL.exp=Date.now()+(j.expires_in||3600)*1000;
 if(j.refresh_token&&j.refresh_token!==c.rt){c.rt=j.refresh_token;save('settings')}
 CL.ok=true;return j}
async function cloudLogin(pw){return authCall('password',{email:cfg().email,password:pw})}
async function cTok(){
 if(CL.tok&&Date.now()<CL.exp-60000)return CL.tok;
 if(!cfg().rt)throw new Error('غير متصل بالموقع');
 try{await authCall('refresh_token',{refresh_token:cfg().rt})}
 catch(e){if(!navigator.onLine)throw e;CL.ok=false;cfg().rt='';save('settings');throw new Error('انتهت جلسة الربط، سجّل الدخول من الإعدادات')}
 return CL.tok}
async function cApi(path,opt){
 opt=opt||{};const t=await cTok(),c=cfg();
 const r=await fetch(c.url.replace(/\/$/,'')+path,{method:opt.method||'GET',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':'application/json',...(opt.headers||{})},body:opt.body});
 const tx=await r.text();let j=null;try{j=tx?JSON.parse(tx):null}catch(e){}
 if(!r.ok)throw new Error((j&&(j.message||j.error))||('خطأ '+r.status));
 return j}
const cloudOn=()=>!!(CL.ok||cfg().rt);
function toJpeg(file,max,q){return new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('تعذّر تجهيز الصورة')),'image/jpeg',q)};im.onerror=()=>no(new Error('الملف مش صورة'));im.src=r.result};r.onerror=()=>no(new Error('تعذّر قراءة الملف'));r.readAsDataURL(file)})}
async function uploadImg(path,blob){
 const t=await cTok(),c=cfg();
 const r=await fetch(c.url.replace(/\/$/,'')+'/storage/v1/object/product-images/'+path,{method:'POST',headers:{apikey:c.key,Authorization:'Bearer '+t,'Content-Type':'image/jpeg','x-upsert':'true'},body:blob});
 if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||'فشل رفع الصورة')}
 return c.url.replace(/\/$/,'')+'/storage/v1/object/public/product-images/'+path+'?v='+Date.now()}

 }catch(e){manual&&toast('تعذّر الرفع: '+e.message)}}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.25,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.6);o.start();o.stop(a.currentTime+.6)}catch(e){}}

 clearInterval(CL.timer);clearInterval(CL.sTimer);CL.seen=null;
 if(!cfg().rt)return;

 CL.timer=setInterval(()=>{if(S.user)fetchOrders(true)},30000);
 if(DB.sync.on){syncTick();CL.sTimer=setInterval(syncTick,15000)}
 else if(S.user&&can('settings')&&!CL.offered){CL.offered=true;
  modal(`<h3>🔄 تفعيل المزامنة الكاملة</h3><p>عشان تفتح البرنامج من الموبايل أو أي جهاز تاني وتلاقي نفس الفواتير والمخزون والعملاء، لازم نرفع بيانات البرنامج أونلاين.</p><p class="mut">لو ده الجهاز الأساسي اللي فيه بياناتك، دوس «تفعيل» وهيرفعها كلها.</p><div class="row"><button class="btn" onclick="closeModal();cloudInitialSync()">تفعيل</button><button class="btn g" onclick="closeModal()">مش دلوقتي</button></div>`)}}

/* ================= المزامنة الكاملة بين الأجهزة ================= */
const SYNC_COLLS=['products','customers','sales','expenses','users','stocklog','settings'];
const SYNC_SET=new Set(SYNC_COLLS);
const sj=o=>JSON.stringify(o,(k,v)=>v&&typeof v==='object'&&!Array.isArray(v)?Object.keys(v).sort().reduce((a,x)=>(a[x]=v[x],a),{}):v);
const syncOn=()=>!!(DB.sync&&DB.sync.on&&cfg().rt);
const kid=(c,o)=>c=='products'?o.code:(o.id||(o.id=uid()));
function recs(c){
 if(c=='settings'){const s={...DB.settings};for(const k of['cloud','lastBackup','logoUp'])delete s[k];return[['main',s]]}
 return(DB[c]||[]).map(o=>[kid(c,o),o])}
function schedPush(){if(!syncOn())return;clearTimeout(CL.pt);CL.pt=setTimeout(pushChanges,1200)}
async function pushChanges(){
 if(!syncOn())return;
 if(CL.pushing){CL.again=true;return}
 CL.pushing=true;
 try{
  const rows=[],upd=[];
  for(const c of SYNC_COLLS){
   const snap=DB.sync.snap[c]||(DB.sync.snap[c]={}),seen=new Set();
   for(const[id,o]of recs(c)){seen.add(id);const h=hash(sj(o));if(snap[id]!==h){rows.push({coll:c,id:String(id),data:o,deleted:false});upd.push([c,String(id),h])}}
   for(const id in snap)if(!seen.has(id)){rows.push({coll:c,id,data:{},deleted:true});upd.push([c,id,null])}}
  for(let i=0;i<rows.length;i+=150)await cApi('/rest/v1/records?on_conflict=coll,id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows.slice(i,i+150))});
  for(const[c,id,h]of upd){if(h===null)delete DB.sync.snap[c][id];else DB.sync.snap[c][id]=h}
  if(rows.length)saveSync();
  CL.syncErr=''
 }catch(e){CL.syncErr=e.message}
 CL.pushing=false;
 if(CL.again){CL.again=false;schedPush()}}
function applyRec(r){
 const c=r.coll;if(!SYNC_SET.has(c))return false;
 const snap=DB.sync.snap[c]||(DB.sync.snap[c]={});
 if(c=='settings'){
  if(r.deleted)return false;
  const h=hash(sj(r.data));if(snap.main===h)return false;
  DB.settings={...DB.settings,...r.data};snap.main=h;CL.dirty.add('settings');return true}
 const arr=DB[c],key=c=='products'?'code':'id',id=String(r.id),i=arr.findIndex(o=>String(o[key])===id);
 if(r.deleted){if(i<0){delete snap[id];return false}arr.splice(i,1);delete snap[id];CL.dirty.add(c);return true}
 const h=hash(sj(r.data));
 if(i>=0){if(snap[id]===h)return false;if(hash(sj(arr[i]))===h){snap[id]=h;return false};arr[i]=r.data}
 else arr.push(r.data);
 snap[id]=h;CL.dirty.add(c);return true}
async function pullChanges(full){
 if(!cloudOn()||CL.pulling)return false;
 CL.pulling=true;let changed=false;
 try{
  let last=full?'1970-01-01T00:00:00Z':(DB.sync.last||'1970-01-01T00:00:00Z');
  for(;;){
   const rows=await cApi('/rest/v1/records?select=coll,id,data,deleted,updated_at&updated_at=gt.'+encodeURIComponent(last)+'&order=updated_at.asc&limit=500');
   if(!rows||!rows.length)break;
   for(const r of rows)if(applyRec(r))changed=true;
   last=rows[rows.length-1].updated_at;
   if(rows.length<500)break}
  DB.sync.last=last;saveSync();
  if(CL.dirty.size){saveLocal(...CL.dirty);CL.dirty.clear()}
  CL.syncErr=''
 }catch(e){CL.syncErr=e.message}
 CL.pulling=false;return changed}
function afterPull(){
 if(S.user){const u=DB.users.find(x=>x.id==S.user.id);if(!u||!u.active){S.user=null;S.cart=[]}else S.user=u}
 const a=document.activeElement;
 if($('.ov')||$('#modal .box')||(a&&/INPUT|SELECT|TEXTAREA/.test(a.tagName)))return;
 render()}
async function syncTick(){
 if(!syncOn())return;
 const ch=await pullChanges();
 await pushChanges();
 if(ch)afterPull()}
async function cloudInitialSync(){
 try{
  await cTok();
  const r=await cApi('/rest/v1/records?select=id&limit=1');
  if(r&&r.length){
   if(!confirm('فيه بيانات برنامج محفوظة أونلاين من جهاز تاني.\nهيتم تحميلها على الجهاز ده، وأي بيانات محلية موجودة هنا هتتستبدل.\nتكمّل؟'))return false;
   for(const c of['products','customers','sales','expenses','users','stocklog'])DB[c]=[];
   DB.sync={on:true,last:'1970-01-01T00:00:00Z',snap:{}};
   await pullChanges(true);
   if(!DB.products.length||!DB.users.length)throw new Error('البيانات الأونلاين ناقصة، حاول تاني');
   saveLocal(...KEYS);saveSync();
   S.user=null;S.cart=[];render();
   toast('تم تحميل البيانات ✔ سجّل دخول بالمستخدم والرقم السري بتوعك')
  }else{
   DB.sync={on:true,last:'1970-01-01T00:00:00Z',snap:{}};saveSync();
   await pushChanges();
   if(CL.syncErr)throw new Error(CL.syncErr);
   toast('تم رفع كل بيانات البرنامج أونلاين ✔')}
  cloudStart();return true
 }catch(e){DB.sync.on=false;saveSync();toast('فشل تفعيل المزامنة: '+e.message);return false}}
async function nextNo(){
 const floor=DB.sales.reduce((m,s)=>Math.max(m,+s.no||0),0);
 if(syncOn()){try{const n=await cApi('/rest/v1/rpc/next_invoice',{method:'POST',body:JSON.stringify({p_floor:floor})});if(+n>0)return +n}catch(e){toast('مفيش اتصال بالإنترنت: رقم الفاتورة محلي مؤقتًا')}}
 return floor+1}

function payMap(name){const pays=DB.settings.pays,n=String(name||'');

function acceptOrder(id){

async function doAccept(id,dv,dtype){
 closeModal();

 if(syncOn())await pullChanges();
 let sale=DB.sales.find(s=>s.onlineId==o.id);

  else{let ch=false;if(!c.area&&o.area){c.area=o.area;ch=true}if(!c.address&&o.address){c.address=o.address;ch=true}if(ch)save('customers')}
  const st=DB.settings;
  sale={id:uid(),no:await nextNo(),date:new Date().toISOString(),userId:S.user.id,userName:S.user.name,customerId:c.id,customerName:c.name,
   items:(o.items||[]).map(i=>{const p=prod(i.code);return{code:i.code,name:i.name,size:i.size||'',qty:i.qty,price:i.price,cost:p?p.cost:0}}),
   subtotal:o.subtotal,discount:disc,delivery:+o.delivery||0,total:Math.round((o.subtotal-disc+(+o.delivery||0))*100)/100,pay:payMap(o.pay),

 try{

async function rejectOrder(id){

function rb(){return `<div class="card row"><span>من</span><input type="date" value="${S.from}" onchange="S.from=this.value;go(S.page)" style="max-width:160px"><span>إلى</span><input type="date" value="${S.to}" onchange="S.to=this.value;go(S.page)" style="max-width:160px"><button class="btn s o" onclick="setR('d')">اليوم</button><button class="btn s o" onclick="setR('w')">آخر 7 أيام</button><button class="btn s o" onclick="setR('m')">الشهر</button><button class="btn s o" onclick="setR('a')">الكل</button></div>`}
function setR(k){const d=new Date();S.to=ymd(d);S.from=k=='d'?ymd(d):k=='w'?ymd(new Date(d-6*864e5)):k=='m'?ymd(new Date(d.getFullYear(),d.getMonth(),1)):'2000-01-01';go(S.page)}

const cats=()=>[...new Set(DB.products.filter(p=>p.active).map(p=>p.cat||'أخرى'))];
PAGE.pos=()=>{$('#main').innerHTML=`<div class="pos"><div><input id="q" placeholder="🔍 ابحث باسم المنتج أو الكود" value="${esc(S.q)}" oninput="S.q=this.value;drawGrid()"><div class="chips" id="chips"></div><div class="grid" id="pgrid"></div></div><div class="card cartbox" id="cart"></div></div>`;drawGrid();drawCart()};
function drawGrid(){
 $('#chips').innerHTML=['',...cats()].map(c=>`<a class="${S.cat==c?'on':''}" onclick="S.cat='${esc(c)}';drawGrid()">${c||'الكل'}</a>`).join('');
 const q=S.q.trim();
 const l=DB.products.filter(p=>p.active&&p.price>0&&(!S.cat||(p.cat||'أخرى')==S.cat)&&(!q||(p.name+' '+p.size+' '+p.code).includes(q)));
 $('#pgrid').innerHTML=l.map(p=>`<div class="pc ${p.stock!=null&&p.stock<=0?'out':''}" onclick="addCart('${p.code}')"><div class="pn">${esc(p.name)}</div><div class="ps">${esc(p.size)}</div><div class="pp">${(+p.disc>0)?`<s class="mut" style="font-weight:400">${n2(p.price)}</s> `:''}${n2(ep(p))} ج${(+p.disc>0)?` <span class="bd">-${p.disc}%</span>`:''}</div>${p.stock!=null?`<div class="st ${lowOf(p)?'lw':''}">متاح: ${p.stock}</div>`:''}</div>`).join('')||'<p class="mut">مفيش منتجات</p>'}
function addCart(c){const i=S.cart.find(x=>x.code==c);i?i.qty++:S.cart.push({code:c,qty:1});drawCart()}
function qty(c,d){const i=S.cart.find(x=>x.code==c);if(!i)return;i.qty+=d;if(i.qty<=0)S.cart=S.cart.filter(x=>x!==i);drawCart()}
function clearCart(){S.cart=[];S.disc='';S.note='';S.cust='';S.area='';S.addr='';drawCart()}
function pickCust(id){S.cust=id;const c=cust(id);S.area=c?c.area||'':'';S.addr=c?c.address||'':'';drawCart()}
const areasList=()=>[...new Set([...DB.customers.map(c=>c.area),...DB.sales.map(s=>s.area)].filter(Boolean))];
function totals(){const sub=S.cart.reduce((a,i)=>a+ep(prod(i.code))*i.qty,0);let d=S.dtype=='pct'?sub*(+S.disc||0)/100:(+S.disc||0);d=Math.min(Math.max(d,0),sub);return{sub,d,total:sub-d}}
function drawCart(){
 const pays=DB.settings.pays;if(!S.pay||!pays.includes(S.pay))S.pay=pays[0];
 const cs=[...DB.customers].sort((a,b)=>a.name.localeCompare(b.name,'ar'));
 $('#cart').innerHTML=`<h3>🧾 الفاتورة</h3><div class="items">${S.cart.map(i=>{const p=prod(i.code);return `<div class="ci"><div class="cn">${esc(p.name)} <small class="mut">${esc(p.size)}</small><br><small class="mut">${n2(ep(p))} ج</small></div><div class="qty"><button onclick="qty('${i.code}',-1)">−</button><b>${i.qty}</b><button onclick="qty('${i.code}',1)">+</button></div><div class="ct">${n2(ep(p)*i.qty)}</div><a onclick="qty('${i.code}',-9999)">✕</a></div>`}).join('')||'<p class="mut">اضغط على منتج لإضافته</p>'}</div>
 <label>العميل</label><div class="row"><select onchange="pickCust(this.value)"><option value="">— بدون عميل —</option>${cs.map(c=>`<option value="${c.id}" ${S.cust==c.id?'selected':''}>${esc(c.name)} ${esc(c.phone||'')}</option>`).join('')}</select><button class="btn o s" onclick="custModal(null,true)">+ جديد</button></div>
 <div class="row"><div style="flex:1"><label>المنطقة</label><input list="arl" value="${esc(S.area)}" oninput="S.area=this.value"><datalist id="arl">${areasList().map(a=>`<option value="${esc(a)}">`).join('')}</datalist></div><div style="flex:2"><label>العنوان</label><input value="${esc(S.addr)}" oninput="S.addr=this.value"></div></div>
 ${can('discount')?`<label>الخصم</label><div class="row"><input type="number" min="0" value="${esc(S.disc)}" oninput="S.disc=this.value;drawTotals()"><select style="max-width:80px" onchange="S.dtype=this.value;drawTotals()"><option value="amt" ${S.dtype=='amt'?'selected':''}>ج</option><option value="pct" ${S.dtype=='pct'?'selected':''}>%</option></select></div>`:''}
 <label>طريقة الدفع</label><select onchange="S.pay=this.value">${pays.map(x=>`<option ${S.pay==x?'selected':''}>${esc(x)}</option>`).join('')}</select>
 <label>ملاحظة</label><input value="${esc(S.note)}" oninput="S.note=this.value">
 <div class="tot" id="tot"></div><button class="btn big" onclick="checkout()">✔ إتمام البيع</button><button class="btn g" style="width:100%;margin-top:6px" onclick="clearCart()">مسح الفاتورة</button>`;
 drawTotals()}
function drawTotals(){const t=totals();$('#tot').innerHTML=`<div><span>المجموع</span><span>${n2(t.sub)}</span></div>${t.d?`<div><span>الخصم</span><span>- ${n2(t.d)}</span></div>`:''}<div class="g"><span>الإجمالي</span><span>${n2(t.total)} ج</span></div>`}
async function checkout(){
 if(!S.cart.length)return toast('الفاتورة فاضية');
 if(S.busy)return;S.busy=true;
 const t=totals(),c=cust(S.cust),st=DB.settings;
 const no=await nextNo();S.busy=false;
 if(!S.cart.length)return;
 st.nextInvoice=no+1;
 const sale={id:uid(),no,date:new Date().toISOString(),userId:S.user.id,userName:S.user.name,customerId:c?c.id:'',customerName:c?c.name:'',
  items:S.cart.map(i=>{const p=prod(i.code);return{code:p.code,name:p.name,size:p.size,qty:i.qty,price:ep(p),cost:p.cost}}),
  subtotal:t.sub,discount:t.d,total:t.total,pay:S.pay,note:S.note,area:S.area.trim(),address:S.addr.trim(),status:'ok'};
 if(c){let ch=false;if(!c.area&&sale.area){c.area=sale.area;ch=true}if(!c.address&&sale.address){c.address=sale.address;ch=true}if(ch)save('customers')}
 DB.sales.push(sale);
 for(const i of sale.items){const p=prod(i.code);if(p&&p.stock!=null){p.stock-=i.qty;DB.stocklog.push({date:sale.date,code:p.code,delta:-i.qty,reason:'بيع #'+sale.no,user:S.user.name})}}
 save('sales','products','settings','stocklog');schedSync();
 S.cart=[];S.disc='';S.note='';S.cust='';S.area='';S.addr='';
 drawCart();drawGrid();invModal(sale);
 if(st.autoPrint)setTimeout(()=>doPrint(),600)}

function invHTML(s,paper){
 const st=DB.settings,a4=paper==='a4';
 const css=`@page{size:${a4?'A4':'80mm auto'};margin:${a4?'12mm':'0'}}*{box-sizing:border-box}body{font-family:Tahoma,Arial,sans-serif;direction:rtl;margin:0;color:#000;font-size:${a4?'14px':'12px'};${a4?'':'width:80mm;padding:4mm'}}.c{text-align:center}h2{margin:2px 0}table{width:100%;border-collapse:collapse;margin:8px 0}th,td{padding:${a4?'7px':'3px 2px'};text-align:right;border-bottom:1px ${a4?'solid #ccc':'dashed #000'};vertical-align:top}th{${a4?'background:#f3f3f3':''}}.n{text-align:left;white-space:nowrap}.t{display:flex;justify-content:space-between;padding:2px 0}.g{font-size:${a4?'18px':'15px'};font-weight:bold;border-top:2px solid #000;margin-top:4px;padding-top:4px}.x{color:#c00;font-size:20px;font-weight:bold;text-align:center;border:2px solid #c00;margin:6px 0}img{max-height:${a4?'80px':'55px'};max-width:60%}`;
 return `<!DOCTYPE html><html dir="rtl"><head><meta charset="utf-8"><title>فاتورة ${s.no}</title><style>${css}</style></head><body><div class="c">${st.logo?`<img src="${st.logo}"><br>`:''}<h2>${esc(st.shopName)}</h2>${st.phone?`<div>${esc(st.phone)}</div>`:''}${st.address?`<div>${esc(st.address)}</div>`:''}</div><hr>${s.status=='cancelled'?'<div class="x">ملغاة</div>':''}<div class="t"><span>فاتورة رقم: <b>${s.no}</b></span><span>${dt(s.date)}</span></div><div class="t"><span>الكاشير: ${esc(s.userName)}</span>${s.customerName?`<span>العميل: ${esc(s.customerName)}</span>`:''}</div>${s.area||s.address?`<div>العنوان: ${esc([s.area,s.address].filter(Boolean).join(' - '))}</div>`:''}<table><tr><th>الصنف</th><th>الكمية</th><th>السعر</th><th class="n">الإجمالي</th></tr>${s.items.map(i=>`<tr><td>${esc(i.name)} ${esc(i.size)}</td><td>${i.qty}</td><td>${n2(i.price)}</td><td class="n">${n2(i.price*i.qty)}</td></tr>`).join('')}</table><div class="t"><span>المجموع</span><span>${n2(s.subtotal)}</span></div>${s.discount?`<div class="t"><span>الخصم</span><span>- ${n2(s.discount)}</span></div>`:''}${s.delivery?`<div class="t"><span>التوصيل</span><span>${n2(s.delivery)}</span></div>`:''}<div class="t g"><span>الإجمالي</span><span>${n2(s.total)} ج</span></div><div class="t"><span>طريقة الدفع</span><span>${esc(s.pay)}</span></div>${s.note?`<div>ملاحظة: ${esc(s.note)}</div>`:''}<hr><div class="c">${esc(st.footer)}</div></body></html>`}
function printHTML(html,title){
 const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);
 f.contentDocument.open();f.contentDocument.write(html);f.contentDocument.close();
 setTimeout(()=>{const old=document.title;if(title)document.title=title;f.contentWindow.focus();f.contentWindow.print();document.title=old;setTimeout(()=>f.remove(),60000)},500)}
function invModal(s,paper){paper=paper||DB.settings.paper;S.invId=s.id;
 modal(`<h3>فاتورة #${s.no}</h3><div class="row"><select id="pp" style="max-width:150px" onchange="invModal(DB.sales.find(x=>x.id==S.invId),this.value)"><option value="80" ${paper=='80'?'selected':''}>حراري 80mm</option><option value="a4" ${paper=='a4'?'selected':''}>A4</option></select><button class="btn" onclick="doPrint()">🖨️ طباعة</button><button class="btn o" onclick="doPrint(1)">📄 حفظ PDF</button><button class="btn o" onclick="waInv()">💬 واتساب</button></div><iframe class="pv" srcdoc="${esc(invHTML(s,paper))}"></iframe><button class="btn g" onclick="closeModal()">إغلاق</button>`,true)}

function waText(s){return `*${DB.settings.shopName}*\nفاتورة رقم ${s.no}\n${dt(s.date)}\n\n`+s.items.map(i=>`• ${i.name} ${i.size} × ${i.qty} = ${n2(i.price*i.qty)}`).join('\n')+(s.discount?`\nخصم: ${n2(s.discount)}`:'')+(s.delivery?`\nتوصيل: ${n2(s.delivery)}`:'')+`\n*الإجمالي: ${n2(s.total)} ج*\n\n${DB.settings.footer}`}

function prodModal(code){const p=code?prod(code):{code:'',name:'',size:'',price:'',cost:'',stock:null,min:null,active:true,cat:''};
 modal(`<h3>${code?'تعديل منتج '+code:'منتج جديد'}</h3><label>اسم المنتج</label><input id="f_name" value="${esc(p.name)}"><div class="row"><div style="flex:1"><label>الحجم / النوع</label><input id="f_size" value="${esc(p.size)}"></div><div style="flex:1"><label>التصنيف</label><input id="f_cat" list="cl" value="${esc(p.cat)}"><datalist id="cl">${[...new Set(DB.products.map(x=>x.cat))].map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div></div><div class="row"><div style="flex:1"><label>سعر البيع</label><input id="f_price" type="number" value="${p.price}"></div><div style="flex:1"><label>التكلفة</label><input id="f_cost" type="number" value="${p.cost}"></div></div><div class="row"><div style="flex:1"><label>خصم % على المنتج (اختياري — بيظهر في الموقع والكاشير)</label><input id="f_disc" type="number" min="0" max="99" value="${p.disc||''}"></div></div><div class="row"><div style="flex:1"><label>المخزون (فاضي = غير متابع)</label><input id="f_stock" type="number" value="${p.stock??''}"></div><div style="flex:1"><label>حد التنبيه (فاضي = الافتراضي)</label><input id="f_min" type="number" value="${p.min??''}"></div></div><label>صورة المنتج (بتظهر في صفحة الطلب)</label><div class="row">${p.img?`<img class="thumb" src="${esc(p.img)}" alt="">`:''}<input type="file" id="f_img" accept="image/*"></div><label><input type="checkbox" id="f_act" ${p.active?'checked':''}> نشط (يظهر في البيع وفي الموقع)</label><div class="row" style="margin-top:12px"><button class="btn" id="svp" onclick="saveProd('${code||''}')">حفظ</button><button class="btn g" onclick="closeModal()">إلغاء</button></div>`)}
async function saveProd(code){const name=val('f_name'),price=+val('f_price'),cost=+val('f_cost'),disc=val('f_disc')===''?0:+val('f_disc');
 if(!name||!(price>0))return toast('اكتب الاسم وسعر البيع');
 if(!(disc>=0&&disc<100))return toast('الخصم لازم يكون بين 0 و 99');
 const file=$('#f_img')&&$('#f_img').files[0];
 if(file&&!cloudOn())return toast('اربط الموقع الأول من الإعدادات عشان ترفع الصورة');
 let p=code?prod(code):null;
 if(!p){const mx=Math.max(0,...DB.products.map(x=>+x.code.slice(1)||0));p={code:'P'+p2(mx+1)};DB.products.push(p)}
 const ns=val('f_stock')===''?null:+val('f_stock');
 if(ns!==p.stock&&ns!=null)DB.stocklog.push({date:new Date().toISOString(),code:p.code,delta:ns-(p.stock||0),reason:'تعديل يدوي',user:S.user.name});
 Object.assign(p,{name,size:val('f_size'),cat:val('f_cat')||catOf(name),price,cost,disc,stock:ns,min:val('f_min')===''?null:+val('f_min'),active:$('#f_act').checked});
 save('products','stocklog');
 if(file){const b=$('#svp');if(b){b.disabled=true;b.textContent='جاري رفع الصورة...'}
  try{p.img=await uploadImg('products/'+p.code+'.jpg',await toJpeg(file,800,.82));save('products')}catch(e){toast('اتحفظ المنتج لكن الصورة فشلت: '+e.message)}}

 const all=DB.customers.map(c=>({c,s:cStats(c.id)}));

 const am=new Map();for(const{c,s}of all){const k=c.area||'غير محدد';const o=am.get(k)||{k,n:0,o:0,t:0};o.n++;o.o+=s.n;o.t+=s.total;am.set(k,o)}

function repData(){
 const ss=salesIn().filter(s=>s.status!='cancelled'),ex=DB.expenses.filter(e=>e.date>=S.from&&e.date<=S.to);
 const P=new Map(),D=new Map(),Y=new Map(),Sr=new Map(),U=new Map(),A=new Map();
 const add=(m,k,rev,cost,n)=>{const o=m.get(k)||{k,rev:0,cost:0,n:0,q:0};o.rev+=rev;o.cost+=cost;o.n+=n;m.set(k,o);return o};
 for(const s of ss){const f=s.subtotal?(s.total-(s.delivery||0))/s.subtotal:1,c=cust(s.customerId),cost=s.items.reduce((a,i)=>a+i.cost*i.qty,0);
  add(D,ymd(s.date),s.total,cost,1);add(Y,s.pay,s.total,cost,1);add(Sr,(c&&c.source)||(c?'غير محدد':'بدون عميل'),s.total,cost,1);add(U,s.userName,s.total,cost,1);add(A,s.area||(c&&c.area)||'غير محدد',s.total,cost,1);
  for(const i of s.items){const o=add(P,i.name+' '+i.size,i.price*i.qty*f,i.cost*i.qty,0);o.q+=i.qty}}
 const rev=ss.reduce((a,s)=>a+s.total,0),cogs=ss.reduce((a,s)=>a+s.items.reduce((b,i)=>b+i.cost*i.qty,0),0),exp=ex.reduce((a,e)=>a+e.amount,0);
 const arr=(m,sortF)=>[...m.values()].sort(sortF);
 return{ss,ex,rev,cogs,gross:rev-cogs,exp,net:rev-cogs-exp,prod:arr(P,(a,b)=>b.rev-a.rev),day:arr(D,(a,b)=>a.k.localeCompare(b.k)),pay:arr(Y,(a,b)=>b.rev-a.rev),src:arr(Sr,(a,b)=>b.rev-a.rev),usr:arr(U,(a,b)=>b.rev-a.rev),area:arr(A,(a,b)=>b.rev-a.rev)}}
const tbl=(h,rows)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${h.length}" class="mut">لا توجد بيانات</td></tr>`}</table></div>`;

 <div class="card"><b>المنتجات (الأكثر مبيعًا)</b>${tbl(['المنتج','الكمية','المبيعات','الربح'],r.prod.map(o=>[esc(o.k),o.q,n2(o.rev),n2(o.rev-o.cost)]))}</div>
 <div class="card"><b>حسب اليوم</b>${tbl(['اليوم','الفواتير','المبيعات','الربح'],r.day.map(o=>[o.k,o.n,n2(o.rev),n2(o.rev-o.cost)]))}</div>
 <div class="card"><b>طرق الدفع</b>${tbl(['الطريقة','الفواتير','المبيعات'],r.pay.map(o=>[esc(o.k),o.n,n2(o.rev)]))}</div>
 <div class="card"><b>مصدر العميل</b>${tbl(['المصدر','الفواتير','المبيعات'],r.src.map(o=>[esc(o.k),o.n,n2(o.rev)]))}</div>
 <div class="card"><b>المناطق</b>${tbl(['المنطقة','الفواتير','المبيعات'],r.area.map(o=>[esc(o.k),o.n,n2(o.rev)]))}</div>
 <div class="card"><b>الكاشير</b>${tbl(['المستخدم','الفواتير','المبيعات'],r.usr.map(o=>[esc(o.k),o.n,n2(o.rev)]))}</div>

 <div class="card"><h3>المستخدمون والصلاحيات</h3><button class="btn" onclick="userModal()">+ مستخدم</button><div class="tw"><table><tr><th>الاسم</th><th>الدور</th><th>الصلاحيات</th><th>نشط</th><th></th></tr>${DB.users.map(u=>`<tr><td>${esc(u.name)}</td><td>${ROLES[u.role]?ROLES[u.role][0]:'مخصص'}</td><td>${u.role=='manager'?'الكل':u.perms.map(p=>PERMS[p]).join('، ')}</td><td>${u.active?'نعم':'لا'}</td><td><button class="btn s o" onclick="userModal('${u.id}')">تعديل</button></td></tr>`).join('')}</table></div><div class="row" style="margin-top:8px"><button class="btn o" onclick="pinModal()">تغيير رقمي السري</button></div></div>
 <div class="card"><h3>النسخ الاحتياطي والبيانات</h3><p class="mut">آخر نسخة احتياطية: ${st.lastBackup?dt(st.lastBackup):'لم تُؤخذ بعد'}. استخدم نفس الملف لنقل البيانات لجهاز تاني.</p><div class="row"><button class="btn" onclick="backup()">⬇️ نسخة احتياطية</button><label class="btn o" style="margin:0">⬆️ استرجاع نسخة<input type="file" accept=".json" hidden onchange="restore(this)"></label><button class="btn o" onclick="allXlsx()">كل الفواتير Excel</button><button class="btn r" onclick="resetData()">بداية جديدة (مسح الفواتير والمصروفات)</button></div></div>`};

/* ================= تصميم الموقع (لوحة تحكم الصفحة) ================= */
const SITE_DEF={theme:{rose:'#cf5559',roseD:'#a73a44',tan:'#dcbd86',tanD:'#b38f4e',ink:'#4a2b2d',mut:'#8c6f66',plum:'#7d5a8e',cream:'#f6eed9',paper:'#fcf8ec',hand:'Aref Ruqaa',body:'Tajawal',base:16,h1:64,radius:20,maxw:1180,gridMin:210},
 text:{heroTitle:'',heroSub:'',cta:'',step1:'',step2:'',step3:'',search:'',closed:'',footer:''},
 show:{hero:true,steps:true,search:true,sprigs:true,gingham:true},order:['hero','steps','shop'],heroImg:'',
 counter:{on:false,title:'',endAt:'',endText:'',bg:'#7d5a8e',fg:'#ffffff'},
 ship:[],freeOver:0,cashOn:true,cashLabel:'',pay:[],gateway:{provider:'',on:false,pub:''},css:'',siteUrl:'https://tetakitchen2-bit.github.io/teta/'};
const SITE_FONTS=['Tajawal','Cairo','Almarai','Aref Ruqaa','Amiri','Changa','El Messiri','Reem Kufi','Lateef','Harmattan','Noto Kufi Arabic','Markazi Text','Rakkas','Lalezar'];
function siteCfg(){const s=DB.settings.site||(DB.settings.site={});
 for(const k in SITE_DEF){const d=SITE_DEF[k];if(s[k]===undefined)s[k]=JSON.parse(JSON.stringify(d));else if(d&&typeof d=='object'&&!Array.isArray(d))s[k]={...d,...s[k]}}
 return s}
const sPath=(o,p,v)=>{const a=p.split('.');let c=o;for(let i=0;i<a.length-1;i++){const k=a[i];if(c[k]==null)c[k]=/^\d+$/.test(a[i+1])?[]:{};c=c[k]}c[a[a.length-1]]=v};
const sIn=(l,p,v,t,x)=>`<div style="flex:1;min-width:140px"><label>${l}</label><input data-p="${p}" type="${t||'text'}" value="${esc(v??'')}" ${x||''}></div>`;
const sCk=(l,p,v)=>`<label style="display:block;margin:4px 0"><input type="checkbox" data-p="${p}" ${v?'checked':''}> ${l}</label>`;
const sSel=(l,p,v,o)=>`<div style="flex:1;min-width:140px"><label>${l}</label><select data-p="${p}">${o.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;
function sPost(){const f=$('#sitePrev');if(f&&f.contentWindow)f.contentWindow.postMessage({tt:'site',site:JSON.parse(JSON.stringify(DB.settings.site))},'*')}
function siteEvt(e){const el=e.target,p=el.dataset&&el.dataset.p;if(!p)return;
 const v=el.type=='checkbox'?el.checked:(el.type=='number')?(el.value===''?'':+el.value):el.value;
 sPath(siteCfg(),p,v);sPost();clearTimeout(siteEvt.t);siteEvt.t=setTimeout(()=>saveLocal('settings'),500)}
const siteRe=()=>{const y=scrollY;go('site');scrollTo(0,y)};
function siteAdd(k,pre){const s=siteCfg();s[k].push(k=='ship'?{name:'',fee:0,eta:'',areas:'',active:true}:{icon:'💳',name:'',number:'',note:'',transfer:true,active:true,...(pre||{})});saveLocal('settings');siteRe()}
function siteDel(k,i){siteCfg()[k].splice(i,1);saveLocal('settings');siteRe()}
function siteMove(i,d){const o=siteCfg().order,j=i+d;if(j<0||j>=o.length)return;[o[i],o[j]]=[o[j],o[i]];saveLocal('settings');siteRe()}
function siteReset(){if(!confirm('إعادة كل إعدادات التصميم للوضع الافتراضي؟'))return;DB.settings.site={};saveLocal('settings');siteRe()}
async function siteSave(){saveLocal('settings');save('settings');await pushSettings(true)}
PAGE.site=()=>{const s=siteCfg(),t=s.theme,x=s.text,sh=s.show,c=s.counter,g=s.gateway;
 const col=(l,k)=>sIn(l,'theme.'+k,t[k],'color','style="height:38px;padding:2px"');
 const num=(l,p,v,a,b)=>sIn(l,p,v,'number',`min="${a}" max="${b}"`);
 const NM={hero:'الهيرو (اللوجو والعنوان)',steps:'خطوات الطلب',shop:'المنتجات'};
 const row=h=>`<div class="row">${h}</div>`;
 $('#main').innerHTML=`<div class="card"><div class="row"><button class="btn" onclick="siteSave()">🚀 نشر على الموقع</button><a class="btn o" href="${esc(s.siteUrl)}" target="_blank">فتح الموقع</a><button class="btn r" onclick="siteReset()">إعادة الضبط</button></div><p class="mut">التعديلات بتظهر فورًا في المعاينة، ولا تظهر للزوار إلا بعد «نشر على الموقع». (لازم تكون مربوط بالموقع من الإعدادات.)</p>${sIn('رابط الموقع للمعاينة','siteUrl',s.siteUrl,'text','dir="ltr"')}</div>
 <div class="row" style="align-items:flex-start"><div style="flex:1 1 460px;min-width:0">
 <div class="card"><h3>⏳ العداد التنازلي (للعروض المحدودة)</h3>${sCk('تشغيل العداد','counter.on',c.on)}${sIn('الكلام اللي فوق العداد (سبب العداد)','counter.title',c.title)}${row(sIn('ينتهي في','counter.endAt',c.endAt,'datetime-local')+sIn('رسالة بعد الانتهاء (اختياري، فاضي = يختفي)','counter.endText',c.endText))}${row(sIn('لون الخلفية','counter.bg',c.bg,'color','style="height:38px;padding:2px"')+sIn('لون الكتابة','counter.fg',c.fg,'color','style="height:38px;padding:2px"'))}</div>
 <div class="card"><h3>🎨 الألوان</h3>${row(col('الأساسي','rose')+col('الأساسي (داكن)','roseD')+col('الإطارات','tan')+col('الإطارات (داكن)','tanD'))}${row(col('لون النص','ink')+col('نص ثانوي','mut')+col('لون مميز (الخصم)','plum')+col('خلفية الصفحة','cream')+col('خلفية الكروت','paper'))}</div>
 <div class="card"><h3>🔤 الخطوط والأحجام</h3>${row(sSel('خط العناوين','theme.hand',t.hand,SITE_FONTS)+sSel('خط النصوص','theme.body',t.body,SITE_FONTS))}${row(num('حجم النص الأساسي (px)','theme.base',t.base,12,24)+num('حجم العنوان الرئيسي (px)','theme.h1',t.h1,30,120)+num('استدارة الحواف (px)','theme.radius',t.radius,0,40)+num('أقصى عرض للصفحة (px)','theme.maxw',t.maxw,700,1600)+num('أقل عرض لكارت المنتج (px)','theme.gridMin',t.gridMin,140,360))}</div>
 <div class="card"><h3>✏️ النصوص (فاضي = النص الأصلي)</h3>${sIn('العنوان الرئيسي','text.heroTitle',x.heroTitle)}${sIn('الوصف تحت العنوان','text.heroSub',x.heroSub)}${row(sIn('زرار الطلب','text.cta',x.cta)+sIn('خانة البحث','text.search',x.search))}${row(sIn('الخطوة ١','text.step1',x.step1)+sIn('الخطوة ٢','text.step2',x.step2)+sIn('الخطوة ٣','text.step3',x.step3))}${sIn('رسالة إيقاف الطلبات','text.closed',x.closed)}${sIn('سطر الفوتر','text.footer',x.footer)}${sIn('رابط صورة الهيرو (فاضي = اللوجو)','heroImg',s.heroImg,'text','dir="ltr"')}</div>
 <div class="card"><h3>🧩 الأقسام وترتيبها</h3>${sCk('الهيرو','show.hero',sh.hero)}${sCk('خطوات الطلب','show.steps',sh.steps)}${sCk('خانة البحث','show.search',sh.search)}${sCk('زخرفة النباتات','show.sprigs',sh.sprigs)}${sCk('شريط الجينجهام','show.gingham',sh.gingham)}<label>الترتيب</label>${s.order.map((k,i)=>`<div class="row"><b style="flex:1">${NM[k]}</b><button class="btn s o" onclick="siteMove(${i},-1)">↑</button><button class="btn s o" onclick="siteMove(${i},1)">↓</button></div>`).join('')}</div>
 <div class="card"><h3>🚚 شركات الشحن</h3><p class="mut">لو ضفت شركة، العميل بيختار منها وسعرها بيحل محل «مصاريف التوصيل» العامة. أسعار المناطق: سطر لكل منطقة بالشكل <b>القاهرة=40</b>.</p>${sIn('شحن مجاني للطلبات فوق (ج) — 0 = متوقف','freeOver',s.freeOver,'number','min="0"')}${s.ship.map((m,i)=>`<div class="card" style="background:#0000000a">${row(sIn('اسم الشركة','ship.'+i+'.name',m.name)+sIn('السعر الأساسي (ج)','ship.'+i+'.fee',m.fee,'number','min="0"')+sIn('مدة التوصيل','ship.'+i+'.eta',m.eta))}<label>أسعار حسب المنطقة/المحافظة</label><textarea data-p="ship.${i}.areas" rows="3" dir="rtl">${esc(m.areas||'')}</textarea>${sCk('مفعّلة','ship.'+i+'.active',m.active!==false)}<button class="btn s r" onclick="siteDel('ship',${i})">حذف</button></div>`).join('')}<button class="btn o" onclick="siteAdd('ship')">+ شركة شحن</button></div>
 <div class="card"><h3>💳 طرق الدفع</h3><p class="mut">لو ضفت طرق هنا بتحل محل خانات فودافون كاش/إنستا باي القديمة. «يحتاج تحويل» يعني العميل لازم يكتب رقم العملية أو يرفع صورة.</p>${sCk('كاش عند الاستلام','cashOn',s.cashOn)}${s.pay.map((m,i)=>`<div class="card" style="background:#0000000a">${row(sIn('أيقونة','pay.'+i+'.icon',m.icon)+sIn('الاسم','pay.'+i+'.name',m.name)+sIn('الرقم / العنوان','pay.'+i+'.number',m.number,'text','dir="ltr"'))}${sIn('تعليمات للعميل (اختياري)','pay.'+i+'.note',m.note)}${sCk('يحتاج تحويل ورقم عملية','pay.'+i+'.transfer',m.transfer!==false)}${sCk('مفعّلة','pay.'+i+'.active',m.active!==false)}<button class="btn s r" onclick="siteDel('pay',${i})">حذف</button></div>`).join('')}<div class="row"><button class="btn o" onclick="siteAdd('pay',{icon:'📱',name:'فودافون كاش'})">+ فودافون كاش</button><button class="btn o" onclick="siteAdd('pay',{icon:'🏦',name:'انستاباي'})">+ إنستا باي</button><button class="btn o" onclick="siteAdd('pay')">+ طريقة أخرى</button></div>
 <h3 style="margin-top:14px">🔌 الدفع الأونلاين (مجهّز للربط لاحقًا)</h3><p class="mut">مكان محفوظ فقط دلوقتي — التفعيل الحقيقي (Paymob / Fawry) هيحتاج سيرفر. ⚠️ ماتكتبش هنا أي مفتاح سري (Secret)، لأن الإعدادات دي عامة.</p>${row(sSel('المزوّد','gateway.provider',g.provider,['','Paymob','Fawry','Kashier','أخرى'])+sIn('المفتاح العام (Public)','gateway.pub',g.pub,'text','dir="ltr"'))}${sCk('تفعيل (لما الربط يجهز)','gateway.on',g.on)}</div>
 <div class="card"><h3>🧪 CSS مخصص (متقدم)</h3><p class="mut">بيتطبق فوق كل التصميم. مثال: <span dir="ltr">.pc{box-shadow:none}</span></p><textarea data-p="css" rows="8" dir="ltr" style="font-family:monospace">${esc(s.css)}</textarea></div>
 </div><div style="flex:1 1 360px;min-width:0;position:sticky;top:56px"><iframe id="sitePrev" src="${esc(s.siteUrl)}" onload="sPost()" style="width:100%;height:82vh;border:2px solid #ccc;border-radius:12px;background:#fff"></iframe></div></div>`;
 const m=$('#main');m.oninput=m.onchange=siteEvt};
async function cloudConnect(){
 const c=cfg();c.url=val('c_url');c.key=val('c_key');c.email=val('c_email');const pw=$('#c_pw').value;
 if(!pw&&c.rt){save('settings');return toast('محفوظ')}
 if(!c.url||!c.key||!c.email||!pw)return toast('اكمل كل البيانات واكتب الباسورد');
 toast('جاري الاتصال...');
 try{await cloudLogin(pw);saveLocal('settings');toast('تم الاتصال ✔');
  const ok=DB.sync.on||await cloudInitialSync();
  if(ok){await syncProducts();await pushSettings()}
  cloudStart();render()}
 catch(e){toast('فشل الاتصال: '+e.message)}}
async function saveWeb(){
 Object.assign(DB.settings,{whatsapp:val('w_wa').replace(/\D/g,''),vcash:val('w_vc'),instapay:val('w_ip'),deliveryFee:+val('w_df')||0,minOrder:+val('w_mo')||0,accepting:$('#w_acc').checked});
 save('settings');await pushSettings(true)}
function setLogo(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,320/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);DB.settings.logo=c.toDataURL('image/png');save('settings');go('settings')};im.src=r.result};r.readAsDataURL(f)}
function saveSet(){Object.assign(DB.settings,{shopName:val('s_name')||'تيتة',phone:val('s_phone'),address:val('s_addr'),footer:val('s_foot'),paper:val('s_paper'),cc:val('s_cc')||'20',lowStock:+val('s_low')||0,autoPrint:$('#s_auto').checked,pays:lines(val('s_pays')),sources:lines(val('s_src')),expCats:lines(val('s_exp'))});
 if(!DB.settings.pays.length)DB.settings.pays=['كاش'];save('settings');toast('تم الحفظ');pushSettings();render()}
function userModal(id){const u=id?DB.users.find(x=>x.id==id):{name:'',role:'cashier',perms:ROLES.cashier[1],active:true};
 modal(`<h3>${id?'تعديل مستخدم':'مستخدم جديد'}</h3><label>الاسم</label><input id="u_name" value="${esc(u.name)}"><label>الرقم السري ${id?'(سيبه فاضي لو مش هتغيره)':''}</label><input id="u_pin" type="password" inputmode="numeric"><label>الدور</label><select id="u_role" onchange="rolePreset(this.value)">${Object.entries(ROLES).map(([k,v])=>`<option value="${k}" ${u.role==k?'selected':''}>${v[0]}</option>`).join('')}</select><label>الصلاحيات (تقدر تعدّلها)</label><div class="perms">${Object.entries(PERMS).map(([k,v])=>`<label><input type="checkbox" class="pm" value="${k}" ${u.role=='manager'||u.perms.includes(k)?'checked':''}> ${v}</label>`).join('')}</div><label><input type="checkbox" id="u_act" ${u.active?'checked':''}> نشط</label><div class="row" style="margin-top:12px"><button class="btn" onclick="saveUser('${id||''}')">حفظ</button><button class="btn g" onclick="closeModal()">إلغاء</button></div>`)}
function rolePreset(r){document.querySelectorAll('.pm').forEach(c=>c.checked=ROLES[r][1].includes(c.value))}
function saveUser(id){const name=val('u_name'),pin=val('u_pin');if(!name)return toast('اكتب الاسم');if(!id&&pin.length<4)return toast('الرقم السري 4 أرقام على الأقل');
 const role=val('u_role'),perms=role=='manager'?Object.keys(PERMS):[...document.querySelectorAll('.pm')].filter(c=>c.checked).map(c=>c.value),active=$('#u_act').checked;
 let u=id?DB.users.find(x=>x.id==id):null;
 const others=DB.users.filter(x=>x!==u&&x.active&&x.role=='manager').length;
 if(!others&&!(role=='manager'&&active))return toast('لازم يفضل مدير واحد نشط على الأقل');
 if(!u){u={id:uid()};DB.users.push(u)}
 Object.assign(u,{name,role,perms,active});if(pin){u.pin=hash(pin);u.mustChange=false}
 save('users');closeModal();if(u.id==S.user.id)S.user=u;go('settings')}
function backup(){const safe={...DB,settings:{...DB.settings,cloud:{...DB.settings.cloud,rt:''}}};delete safe.sync;download(new Blob([JSON.stringify(safe)],{type:'application/json'}),`titta-backup-${ymd(new Date())}.json`);DB.settings.lastBackup=Date.now();save('settings');toast('تم تحميل النسخة');render()}
function restore(inp){const f=inp.files[0];if(!f||!confirm('هيتم استبدال كل البيانات الحالية بالنسخة دي. متأكد؟'))return;const r=new FileReader();
 r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.users)throw 0;const rt=cfg().rt;for(const k of KEYS)if(d[k]!==undefined)DB[k]=d[k];DB.settings={...DEF_SET,...DB.settings};DB.settings.cloud={...DEF_SET.cloud,...(DB.settings.cloud||{}),rt:rt||''};save(...KEYS);S.user=null;toast('تم الاسترجاع');render()}catch(e){toast('الملف مش نسخة صحيحة')}};r.readAsText(f)}
function allXlsx(){download(xlsx([{name:'الفواتير',rows:[['رقم','التاريخ','العميل','الكاشير','الدفع','المجموع','الخصم','الإجمالي','الحالة'],...DB.sales.map(s=>[s.no,dt(s.date),s.customerName,s.userName,s.pay,s.subtotal,s.discount,s.total,s.status=='cancelled'?'ملغاة':'سليمة'])]},{name:'تفاصيل الأصناف',rows:[['رقم الفاتورة','المنتج','الحجم','الكمية','السعر','التكلفة'],...DB.sales.flatMap(s=>s.items.map(i=>[s.no,i.name,i.size,i.qty,i.price,i.cost]))]}]),'كل-الفواتير.xlsx')}
function resetData(){if(!confirm('هيتم مسح كل الفواتير والمصروفات وسجل المخزون. المنتجات والعملاء والمستخدمين هيفضلوا. متأكد؟'))return;if(!confirm('تأكيد أخير: خدت نسخة احتياطية؟ العملية مش بترجع.'))return;
 DB.sales=[];DB.expenses=[];DB.stocklog=[];DB.settings.nextInvoice=1;save('sales','expenses','stocklog','settings');
 if(syncOn())cApi('/rest/v1/rpc/reset_invoice_counter',{method:'POST',body:'{}'}).catch(()=>{});
 toast('تم');go('settings')}

init();
</script>
